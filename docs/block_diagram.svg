<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#ffffff"/>

  <!-- Row 1: Sensors -->
  <rect x="60" y="40" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="135" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">Tilt sensor</text>
  <text x="135" y="80" text-anchor="middle" font-size="12" fill="#0F6E56">Detects slope movement</text>

  <rect x="240" y="40" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="315" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">Rain gauge</text>
  <text x="315" y="80" text-anchor="middle" font-size="12" fill="#0F6E56">Measures rainfall level</text>

  <!-- Arrows down to Arduino -->
  <path d="M135 96 L135 130 L340 130 L340 156" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="315" y1="96" x2="315" y2="156" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: Arduino -->
  <rect x="240" y="156" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#26215C">Arduino</text>
  <text x="340" y="196" text-anchor="middle" font-size="12" fill="#3C3489">Reads sensors, checks threshold</text>

  <line x1="340" y1="212" x2="340" y2="246" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 3: Bluetooth module -->
  <rect x="240" y="246" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="340" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A1B0C">HC-05 Bluetooth module</text>
  <text x="340" y="286" text-anchor="middle" font-size="12" fill="#993C1D">Sends data wirelessly</text>

  <line x1="340" y1="302" x2="340" y2="336" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 4: App -->
  <rect x="215" y="336" width="250" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#412402">MIT App Inventor app</text>
  <text x="340" y="376" text-anchor="middle" font-size="12" fill="#854F0B">Displays data, sounds alert</text>
</svg>
